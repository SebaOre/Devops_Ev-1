version: 2
updates:
  - package-ecosystem: pip
    directories:
      - /
      - /backend
      - /estadisticas
    schedule:
      interval: weekly
      day: monday
      time: "10:00"
      timezone: America/Santiago
    open-pull-requests-limit: 5
    groups:
      python-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: docker
    directories:
      - /
      - /backend
      - /estadisticas
    schedule:
      interval: weekly
      day: monday
      time: "10:00"
      timezone: America/Santiago
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "10:00"
      timezone: America/Santiago
    open-pull-requests-limit: 5
