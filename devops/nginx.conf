worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 256;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;

    log_format upstream '$request_method $uri status=$status upstream=$upstream_addr';
    access_log /dev/stdout upstream;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 2s;

    upstream usuarios_api {
        zone usuarios_api 64k;
        server usuarios:8000 resolve max_fails=1 fail_timeout=5s;
        keepalive 8;
    }

    upstream estadisticas_api {
        zone estadisticas_api 64k;
        server estadisticas:8001 resolve max_fails=1 fail_timeout=5s;
        keepalive 8;
    }

    server {
        listen 8080;
        client_max_body_size 16k;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 2s;
        proxy_read_timeout 15s;
        proxy_next_upstream error timeout http_502 http_503 http_504;

        location = /proxy-health {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        location = /stats {
            proxy_pass http://estadisticas_api;
        }

        location / {
            proxy_pass http://usuarios_api;
        }
    }
}
