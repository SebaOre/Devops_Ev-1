name: devops-ep2

x-runtime: &runtime
  init: true
  restart: unless-stopped
  read_only: true
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=16m,mode=1777
  pids_limit: 128
  logging:
    driver: json-file
    options:
      max-size: "5m"
      max-file: "2"

services:
  usuarios:
    <<: *runtime
    image: ${USUARIOS_IMAGE:-ep2-usuarios:local}
    build:
      context: .
      dockerfile: backend/Dockerfile
    user: "10001:10001"
    environment:
      DATABASE_URL: sqlite:////data/microservicio.db
    volumes:
      - usuarios_data:/data
    networks:
      - servicios
    cpus: 0.50
    mem_limit: 256m
    memswap_limit: 256m
    healthcheck:
      interval: 5s
      timeout: 4s
      start_period: 5s
      retries: 5

  estadisticas:
    <<: *runtime
    image: ${ESTADISTICAS_IMAGE:-ep2-estadisticas:local}
    build:
      context: .
      dockerfile: estadisticas/Dockerfile
    user: "10001:10001"
    environment:
      USERS_SERVICE_URL: http://usuarios:8000
    depends_on:
      usuarios:
        condition: service_healthy
    networks:
      - servicios
    cpus: 0.50
    mem_limit: 128m
    memswap_limit: 128m
    healthcheck:
      interval: 5s
      timeout: 4s
      start_period: 5s
      retries: 5

  gateway:
    <<: *runtime
    image: nginx:1.30.6-alpine@sha256:0e52bd054126cdc040b1276c0af347aeb02a41b9cfe305d6094767ac30e97949
    user: "101:101"
    entrypoint: ["nginx", "-g", "daemon off;"]
    volumes:
      - ./devops/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "127.0.0.1:${APP_PORT:-18080}:8080"
    depends_on:
      usuarios:
        condition: service_healthy
      estadisticas:
        condition: service_healthy
    networks:
      - entrada
      - servicios
    cpus: 0.25
    mem_limit: 64m
    memswap_limit: 64m
    pids_limit: 64
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/proxy-health"]
      interval: 5s
      timeout: 3s
      start_period: 5s
      retries: 5

networks:
  entrada:
    driver: bridge
  servicios:
    driver: bridge
    internal: true

volumes:
  usuarios_data:
